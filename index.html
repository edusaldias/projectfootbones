<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sex Estimation Calculator - Cuneiform Bones</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #18bc9c;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 550px;
            width: 100%;
        }
        h1 {
            color: var(--primary-color);
            font-size: 24px;
            text-align: center;
            margin-bottom: 5px;
        }
        h2 {
            color: #7f8c8d;
            font-size: 14px;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 400;
        }
        .tabs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            border-bottom: 2px solid #dce4ec;
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            color: #7f8c8d;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .tab-btn.active {
            color: var(--secondary-color);
            border-bottom: 3px solid var(--secondary-color);
        }
        .calculator-section {
            display: none;
        }
        .calculator-section.active {
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary-color);
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #dce4ec;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="number"]:focus {
            border-color: var(--secondary-color);
            outline: none;
        }
        button.calc-btn {
            width: 100%;
            background-color: var(--secondary-color);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        button.calc-btn:hover {
            background-color: #128f76;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 6px;
            text-align: center;
            display: none;
        }
        .male {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .female {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .result-title {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sex Estimation Calculator</h1>
    <h2>Methodology based on Chilean Subactual Osteological Series</h2>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'medial')">Medial</button>
        <button class="tab-btn" onclick="switchTab(event, 'intermediate')">Intermediate</button>
        <button class="tab-btn" onclick="switchTab(event, 'lateral')">Lateral</button>
    </div>

    <div id="medial" class="calculator-section active">
        <div class="form-group">
            <label for="mh1">Maximum Height (MH1) in mm:</label>
            <input type="number" id="mh1" step="0.01" placeholder="e.g., 33.00">
        </div>
        <button class="calc-btn" onclick="calculateMedial()">Estimate Sex</button>
    </div>

    <div id="intermediate" class="calculator-section">
        <div class="form-group">
            <label for="ml2">Maximum Length (ML2) in mm:</label>
            <input type="number" id="ml2" step="0.01" placeholder="e.g., 17.50">
        </div>
        <div class="form-group">
            <label for="mh2">Maximum Height (MH2) in mm:</label>
            <input type="number" id="mh2" step="0.01" placeholder="e.g., 21.00">
        </div>
        <div class="form-group">
            <label for="lfn2">Length of the Facet for Navicular (LFN2) in mm:</label>
            <input type="number" id="lfn2" step="0.01" placeholder="e.g., 18.00">
        </div>
        <button class="calc-btn" onclick="calculateIntermediate()">Estimate Sex</button>
    </div>

    <div id="lateral" class="calculator-section">
        <div class="form-group">
            <label for="ml3">Maximum Length (ML3) in mm:</label>
            <input type="number" id="ml3" step="0.01" placeholder="e.g., 23.50">
        </div>
        <div class="form-group">
            <label for="mh3">Maximum Height (MH3) in mm:</label>
            <input type="number" id="mh3" step="0.01" placeholder="e.g., 24.00">
        </div>
        <button class="calc-btn" onclick="calculateLateral()">Estimate Sex</button>
    </div>

    <div id="result" class="result-box">
        <div id="resultTitle" class="result-title"></div>
    </div>
</div>

<script>
    function switchTab(evt, boneName) {
        const sections = document.getElementsByClassName("calculator-section");
        for (let i = 0; i < sections.length; i++) {
            sections[i].classList.remove("active");
        }
        const buttons = document.getElementsByClassName("tab-btn");
        for (let i = 0; i < buttons.length; i++) {
            buttons[i].classList.remove("active");
        }
        document.getElementById(boneName).classList.add("active");
        evt.currentTarget.classList.add("active");
        document.getElementById('result').style.display = "none";
    }

    // Procesa el Score y define la clasificación directa
    function displayResult(probability) {
        const resultBox = document.getElementById('result');
        const resultTitle = document.getElementById('resultTitle');

        resultBox.style.display = "block";

        // Punto de corte de probabilidad: >= 0.5 es Femenino, < 0.5 es Masculino
        if (probability >= 0.5) {
            resultBox.className = "result-box female";
            resultTitle.innerText = "Estimated Sex: FEMALE";
        } else {
            resultBox.className = "result-box male";
            resultTitle.innerText = "Estimated Sex: MALE";
        }
    }

    // 1. CÁLCULO CUNEIFORME MEDIAL
    function calculateMedial() {
        const mh1 = parseFloat(document.getElementById('mh1').value);
        if (isNaN(mh1)) { alert("Please enter all measurements."); return; }
        
        // Normalización Z-score integrada según promedios del Excel (Media: 31.25, Desv: 2.9163)
        const mh1_norm = (mh1 - 31.25) / 2.916333314;
        const logit = -0.1176 + (-2.3256 * mh1_norm);
        
        const probability = 1 / (1 + Math.exp(-logit));
        displayResult(probability);
    }

    // 2. CÁLCULO CUNEIFORME INTERMEDIO
    function calculateIntermediate() {
        const ml2 = parseFloat(document.getElementById('ml2').value);
        const mh2 = parseFloat(document.getElementById('mh2').value);
        const lfn2 = parseFloat(document.getElementById('lfn2').value);
        if (isNaN(ml2) || isNaN(mh2) || isNaN(lfn2)) { alert("Please enter all measurements."); return; }

        // Normalización Z-score integrada según promedios del Excel
        const ml2_norm = (ml2 - 17.91666667) / 1.341148422;
        const mh2_norm = (mh2 - 21.35) / 1.054363229;
        const lfn2_norm = (lfn2 - 18.25833333) / 1.545349818;
        
        const logit = -0.08882 + (-0.67539 * ml2_norm) + (-1.133979 * mh2_norm) + (0.52643 * lfn2_norm);
        
        const probability = 1 / (1 + Math.exp(-logit));
        displayResult(probability);
    }

    // 3. CÁLCULO CUNEIFORME LATERAL
    function calculateLateral() {
        const ml3 = parseFloat(document.getElementById('ml3').value);
        const mh3 = parseFloat(document.getElementById('mh3').value);
        if (isNaN(ml3) || isNaN(mh3)) { alert("Please enter all measurements."); return; }

        // Normalización Z-score integrada según promedios del Excel
        const ml3_norm = (ml3 - 23.58333333) / 1.513234545;
        const mh3_norm = (mh3 - 22.84166667) / 1.492075024;
        
        const logit = -0.07016 + (-0.67515 * ml3_norm) + (-1.03755 * mh3_norm);
        
        const probability = 1 / (1 + Math.exp(-logit));
        displayResult(probability);
    }
</script>

</body>
</html>
